<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mel 상세정보</title>

  <style>
    body {
      margin: 0;
      background: #0a0e17;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .detail-wrap {
      display: flex;
      gap: 30px;
      padding: 30px;
    }

    .champ-img {
      width: 42%;
      text-align: center;
    }

    .champ-img img {
      width: 100%;
      border-radius: 8px;
    }

    .champ-img h2 {
      color: #c8aa6e;
      margin-bottom: 5px;
    }

    .champ-img p {
      color: #ccc;
      font-size: 1.1rem;
    }

    .champ-info {
      width: 58%;
    }

    h3 {
      color: #c8aa6e;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
      margin-top: 0;
    }

    .skill-list div {
      border-bottom: 1px solid #444;
      padding: 12px 0;
      font-size: 1rem;
    }

    .story {
      margin-top: 35px;
      line-height: 1.8;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="detail-wrap">

    <div class="champ-img">
      <img src="../images/mel.jpg" alt="Mel">
      <h2>멜 (Mel)</h2>
      <p>마법사 / 서포터 / 난이도: 중</p>
    </div>

    <div class="champ-info">
      <h3>스킬</h3>

      <div class="skill-list">
        <div>패시브: 찬란한 빛</div>
        <div>Q: 빛의 파편</div>
        <div>W: 황금 방어막</div>
        <div>E: 속박의 광휘</div>
        <div>R: 태양의 심판</div>
      </div>

      <div class="story">
        <h3>배경 스토리 요약</h3>
        <p>
          멜은 강력한 마법 능력을 가진 챔피언으로, 전투에서 아군을 지원하고 적을 견제하는 역할을 수행한다.
          화려한 마법과 방어 능력을 활용하여 전장에서 전략적인 플레이를 펼칠 수 있다.
        </p>
      </div>
    </div>

  </div>
</body>
</html>
