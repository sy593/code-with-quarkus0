<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mel 상세정보</title>

  <style>
    body {
      margin: 0;
      background: #0a0e17;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .detail-wrap {
      display: flex;
      gap: 30px;
      padding: 30px;
    }

    .champ-img {
      width: 42%;
      text-align: center;
    }

    .champ-img img {
      width: 100%;
      border-radius: 8px;
    }

    .champ-img h2 {
      color: #c8aa6e;
      margin-bottom: 5px;
    }

    .champ-img p {
      color: #ccc;
      font-size: 1.1rem;
    }

    .champ-info {
      width: 58%;
    }

    h3 {
      color: #c8aa6e;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
      margin-top: 0;
    }

    .skill-list div {
      border-bottom: 1px solid #444;
      padding: 12px 0;
      font-size: 1rem;
    }

    .story {
      margin-top: 35px;
      line-height: 1.8;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="detail-wrap">

    <div class="champ-img">
      <img src="../images/mel.jpg" alt="Mel">
      <h2>멜 (Mel)</h2>
      <p>마법사 / 서포터 / 난이도: 중</p>
    </div>

    <div class="champ-info">
      <h3>스킬</h3>

      <div class="skill-list">
        <div>패시브: 찬란한 빛</div>
        <div>Q: 빛의 파편</div>
        <div>W: 황금 방어막</div>
        <div>E: 속박의 광휘</div>
        <div>R: 태양의 심판</div>
      </div>

      <div class="story">
        <h3>배경 스토리 요약</h3>
        <p>
           멜 메다르다는 한때 녹서스에서 가장 강력한 가문 중 하나였던 메다르다 가문의 후계자로 여겨지는 인물이다.
           겉으로는 우아한 귀족처럼 보이지만, 실제로는 만나는 사람들에 대한 정보를 파악하고 활용하는 데 능숙한 정치가이다.
           이후 신비로운 검은 장미단과의 사건을 계기로 어머니가 숨겨온 진실과 자신의 마법적 능력을 깨닫게 되었으며,
           답을 찾기 위해 고향으로 향하게 된다.
        </p>
      </div>
    </div>

  </div>
</body>
</html>
