<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaahen 상세정보</title>

  <style>
    body {
      margin: 0;
      background: #0a0e17;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .detail-wrap {
      display: flex;
      gap: 30px;
      padding: 30px;
    }

    .champ-img {
      width: 42%;
      text-align: center;
    }

    .champ-img img {
      width: 100%;
      border-radius: 8px;
    }

    .champ-img h2 {
      color: #c8aa6e;
      margin-bottom: 5px;
    }

    .champ-img p {
      color: #ccc;
      font-size: 1.1rem;
    }

    .champ-info {
      width: 58%;
    }

    h3 {
      color: #c8aa6e;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
      margin-top: 0;
    }

    .skill-list div {
      border-bottom: 1px solid #444;
      padding: 12px 0;
      font-size: 1rem;
    }

    .story {
      margin-top: 35px;
      line-height: 1.8;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="detail-wrap">

    <div class="champ-img">
      <img src="../images/zaahen.jpg" alt="Zaahen">
      <h2>자헨 (Zaahen)</h2>
      <p>전사 / 암살자 / 난이도: 하</p>
    </div>

    <div class="champ-info">
      <h3>스킬</h3>

      <div class="skill-list">
        <div>패시브: 어둠의 본능</div>
        <div>Q: 날카로운 베기</div>
        <div>W: 그림자 방어</div>
        <div>E: 추격 돌진</div>
        <div>R: 처형자의 강림</div>
      </div>

      <div class="story">
        <h3>배경 스토리 요약</h3>
        <p>
          자헨은 근접 전투에 특화된 챔피언으로, 빠르게 적에게 접근하여 강력한 피해를 주는 전사형 챔피언이다.
          전투 진입과 마무리 능력을 중심으로 플레이할 수 있다.
        </p>
      </div>
    </div>

  </div>
</body>
</html>
