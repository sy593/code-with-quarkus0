<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yunara 상세정보</title>

  <style>
    body {
      margin: 0;
      background: #0a0e17;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .detail-wrap {
      display: flex;
      gap: 30px;
      padding: 30px;
    }

    .champ-img {
      width: 42%;
      text-align: center;
    }

    .champ-img img {
      width: 100%;
      border-radius: 8px;
    }

    .champ-img h2 {
      color: #c8aa6e;
      margin-bottom: 5px;
    }

    .champ-img p {
      color: #ccc;
      font-size: 1.1rem;
    }

    .champ-info {
      width: 58%;
    }

    h3 {
      color: #c8aa6e;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
      margin-top: 0;
    }

    .skill-list div {
      border-bottom: 1px solid #444;
      padding: 12px 0;
      font-size: 1rem;
    }

    .story {
      margin-top: 35px;
      line-height: 1.8;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="detail-wrap">

    <div class="champ-img">
      <img src="../images/yunara.jpg" alt="Yunara">
      <h2>유나라 (Yunara)</h2>
      <p>원거리 딜러 / 난이도: 중</p>
    </div>

    <div class="champ-info">
      <h3>스킬</h3>

      <div class="skill-list">
        <div>패시브: 영혼의 흐름</div>
        <div>Q: 정밀 사격</div>
        <div>W: 영혼의 파동</div>
        <div>E: 회피 기동</div>
        <div>R: 결전의 일격</div>
      </div>

      <div class="story">
        <h3>배경 스토리 요약</h3>
        <p>
          유나라는 아이오니아에 대한 굳건한 신념을 가진 챔피언이다.
          그녀는 영혼 세계에 오랜 시간 은둔하며 전설적인 킨코우 유물인 아이온 에르나를 다루는 기술을 연마해 왔다.
          많은 희생을 감수했음에도 불구하고, 아이오니아의 불화와 분쟁을 없애겠다는 그녀의 맹세와 믿음은 흔들리지 않았다.
          그러나 다시 깨어난 고대의 위협과 변화한 세계는 유나라의 결의를 시험하게 된다.
        </p>
      </div>
    </div>

  </div>
</body>
</html>
