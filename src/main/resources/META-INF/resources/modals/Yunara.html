<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yunara 상세정보</title>

  <style>
    body {
      margin: 0;
      background: #0a0e17;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .detail-wrap {
      display: flex;
      gap: 30px;
      padding: 30px;
    }

    .champ-img {
      width: 42%;
      text-align: center;
    }

    .champ-img img {
      width: 100%;
      border-radius: 8px;
    }

    .champ-img h2 {
      color: #c8aa6e;
      margin-bottom: 5px;
    }

    .champ-img p {
      color: #ccc;
      font-size: 1.1rem;
    }

    .champ-info {
      width: 58%;
    }

    h3 {
      color: #c8aa6e;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
      margin-top: 0;
    }

    .skill-list div {
      border-bottom: 1px solid #444;
      padding: 12px 0;
      font-size: 1rem;
    }

    .story {
      margin-top: 35px;
      line-height: 1.8;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="detail-wrap">

    <div class="champ-img">
      <img src="../images/yunara.jpg" alt="Yunara">
      <h2>유나라 (Yunara)</h2>
      <p>원거리 딜러 / 난이도: 중</p>
    </div>

    <div class="champ-info">
      <h3>스킬</h3>

      <div class="skill-list">
        <div>패시브: 영혼의 흐름</div>
        <div>Q: 정밀 사격</div>
        <div>W: 영혼의 파동</div>
        <div>E: 회피 기동</div>
        <div>R: 결전의 일격</div>
      </div>

      <div class="story">
        <h3>배경 스토리 요약</h3>
        <p>
          유나라는 원거리에서 적을 공격하는 챔피언으로, 빠른 움직임과 지속적인 공격 능력을 바탕으로 전투를 이끌어간다.
          안정적인 거리 유지와 정확한 공격이 중요한 챔피언이다.
        </p>
      </div>
    </div>

  </div>
</body>
</html>
