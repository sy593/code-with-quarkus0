<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League of Legends - 가입 완료</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 기존 index.html / register.html에서 사용하던 main.css 재활용 -->
  <link rel="stylesheet" href="/css/main.css">
</head>

<body>

  <!-- 기존 네비게이션 바 재활용 -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
    <div class="container-fluid">

      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="/images/lol_logo.jpg" alt="League of Legends 로고" class="lol-logo">
      </a>

      <button type="button" class="btn border-0 theme-toggle-btn" id="themeToggleBtn">
        DARK
      </button>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link" href="/">뉴스</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/">챔피온</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/main_page_sub/download.html">다운로드</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/login">로그인</a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              외부웹사이트
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="https://lol.ps/" target="_blank">롤전적</a></li>
              <li><a class="dropdown-item" href="#">불법사이트</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#">외부웹</a></li>
            </ul>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- 가입 완료 페이지 -->
  <section class="hero d-flex align-items-center justify-content-center text-center py-5">
    <div class="container" style="max-width: 400px;">

      <h2 class="fw-bold mb-4">🎉 가입 완료!</h2>

      <p class="lead mb-4">
        환영합니다!<br>
        가입이 완료되었습니다.<br>
        로그인 후 서비스를 이용해보세요.
      </p>

      <a href="/login" class="btn btn-primary w-100">
        로그인 하러 가기
      </a>

    </div>
  </section>

  <!-- Toast 컨테이너 -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">

    <div id="liveToast"
         class="toast align-items-center text-white bg-success border-0"
         role="alert">

      <div class="d-flex">
        <div class="toast-body" id="toastBody">
          메시지
        </div>

        <button type="button"
                class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast">
        </button>
      </div>

    </div>
  </div>

  <!-- JS -->
  <script src="/js/bootstrap.bundle.min.js"></script>
  <script src="/js/toggle.js"></script>
  <script src="/js/test.js"></script>

  <script>
    window.addEventListener("load", function() {
      showToast("회원가입이 완료되었습니다!");
    });
  </script>

</body>
</html>
